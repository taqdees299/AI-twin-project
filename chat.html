<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat.html</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
  <title>AI Twin Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>My AI Twin</h2>
    <button id="memoryBtn">Memories</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Talk to your AI Twin...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>

</body>
</html>
